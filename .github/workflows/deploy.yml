name: deploy-mystmd

# Build the MyST site and publish it to the gh-pages branch on every push to master.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # peaceiris pushes the built HTML to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MyST
        run: npm install -g mystmd

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache page execution results
        # myst's execute/transform caches are content-hashed per page: restoring
        # the previous run's cache means only changed pages re-execute (pyscf,
        # marimo sandboxes, plots). A requirements.txt change invalidates all.
        uses: actions/cache@v4
        with:
          path: |
            _build/execute
            _build/cache
          key: myst-build-v2-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            myst-build-v2-${{ hashFiles('requirements.txt') }}-

      - name: Cache uv packages
        # marimo pages resolve their pyproject deps through uv at build time
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ github.sha }}
          restore-keys: |
            uv-

      - name: Install marimo plugin
        # myst.yml registers an executable plugin at .venv/bin/jupyter-book-marimo;
        # it renders {marimo} directives and shells out to uv to execute the cells
        # at build time (deps come from each page's pyproject block).
        run: |
          pip install uv
          uv venv .venv --python 3.13
          uv pip install --python .venv/bin/python jupyter-book-marimo

      - name: Install Python deps for cell execution
        # Kernel environment for `--execute`: lecture {code-cell} blocks and demo
        # notebooks run at build time so the site shows their outputs. Notebooks
        # that cannot run headless carry `execute: skip: true` frontmatter.
        run: pip install -r requirements.txt

      - name: Start Jupyter server for cell execution
        # myst launches its own jupyter_server and gives up after a fixed 20 s. Since
        # 2026-09-14 the runners take longer than that (12 s on 2026-09-04, >20 s after),
        # so every page needing execution was published with bare source and no
        # outputs. Start the server here with a real readiness wait and hand it to
        # myst through JUPYTER_BASE_URL / JUPYTER_TOKEN, which makes myst skip its own
        # launch. root_dir must be the project root, the same path myst would use.
        run: |
          TOKEN=$(python -c "import secrets; print(secrets.token_hex(16))")
          echo "::add-mask::$TOKEN"
          nohup python -m jupyter_server --ServerApp.root_dir "$GITHUB_WORKSPACE" \
            --ServerApp.port=8888 --ServerApp.port_retries=0 \
            --IdentityProvider.token="$TOKEN" > jupyter-server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -H "Authorization: token $TOKEN" http://127.0.0.1:8888/api/status >/dev/null && break
            sleep 2
          done
          curl -sf -H "Authorization: token $TOKEN" http://127.0.0.1:8888/api/status \
            || { echo "Jupyter server did not come up"; cat jupyter-server.log; exit 1; }
          echo "Jupyter server ready after about $((i * 2)) s"
          echo "JUPYTER_BASE_URL=http://127.0.0.1:8888" >> "$GITHUB_ENV"
          echo "JUPYTER_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Generate bilingual Markdown (Chinese translation)
        # Rewrites the Markdown in the workspace so the build below publishes the
        # bilingual site. Nothing here is committed except the translation cache:
        # master stays upstream English, so "Sync fork" keeps merging cleanly.
        #
        # Needs: secret OPENROUTER_API_KEY. The base/model default correctly, so
        # no variables are required. NOTE: an OpenCode zen key will NOT work here
        # -- zen's free models are gated to the OpenCode client ("the free tier can
        # only be used from within OpenCode") and return 403 from CI.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.OPENROUTER_MODEL || 'nemotron-3-ultra-550b-a55b:free' }}
          TRANSLATE_BASE_URL: ${{ vars.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}
        run: |
          LIMIT="${{ vars.TRANSLATE_LIMIT }}"; LIMIT="${LIMIT:-1200}"
          python scripts/translate.py slice
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            python scripts/translate.py translate --batch 8 --limit "$LIMIT" \
              || echo "::warning::translation call failed; publishing with the cache as it stands"
          else
            echo "::warning::OPENROUTER_API_KEY is not set; skipping translation and publishing the existing cache"
          fi
          # apply runs either way: a partial cache still publishes what it has, and
          # a missing key must never block the English site from deploying.
          python scripts/translate.py apply
          python scripts/translate.py stats

      - name: Persist the translation cache
        # The cache is the only durable artefact of the translation. Committing it
        # here means each run starts from the previous run's work, so a weekly sync
        # only translates what the author actually changed. [skip ci] stops this
        # commit from re-triggering the workflow it is part of.
        run: |
          git add -- translation/zh-cache.json
          if git diff --cached --quiet; then
            echo "cache unchanged"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(zh): update translation cache [skip ci]"
            git push
          fi

      - name: Build HTML
        env:
          # Served at https://julianshi.github.io/Chem324/ -> assets need the /Chem324 prefix.
          BASE_URL: /Chem324
          # Retina (2x) matplotlib PNGs; config lives in .ipython/profile_default/.
          IPYTHONDIR: ${{ github.workspace }}/.ipython
        run: myst build --html --execute

      - name: Cache rendered slide decks
        # Rendered decks are never committed; the html + sidecar *_files dirs
        # (reveal.js, chalkboard, menu, ojs runtime) are cached keyed on the
        # deck sources. Only an edit to a .qmd or the theme triggers a re-render.
        id: slides-cache
        uses: actions/cache@v4
        with:
          path: |
            slides/**/*.html
            slides/**/*_files
          key: slides-html-${{ hashFiles('slides/**/*.qmd', 'slides/theme.scss') }}

      - name: Set up Quarto
        if: steps.slides-cache.outputs.cache-hit != 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render lecture slide decks
        if: steps.slides-cache.outputs.cache-hit != 'true'
        run: |
          for f in slides/ch0*/*.qmd slides/math/*.qmd; do
            quarto render "$f" --to revealjs --quiet
          done

      - name: Copy slide decks into site
        # Web-first reveal.js decks under /slides/: each html needs its *_files
        # sidecar, and slide images resolve relatively to ../../chNN/images, so
        # the chapter image dirs must also exist in the published site.
        run: |
          for d in slides/ch0* slides/math; do
            mkdir -p "_build/html/$d"
            cp -r "$d"/*.html "$d"/*_files "_build/html/$d/" 2>/dev/null || true
          done
          for d in ch0*/images math/images; do
            mkdir -p "_build/html/$d"
            cp -r "$d"/. "_build/html/$d/"
          done

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
